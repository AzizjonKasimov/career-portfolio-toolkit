name: Validate toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate content and privacy markers
        shell: pwsh
        run: ./scripts/validate-content.ps1

      - name: Validate application tracker
        shell: pwsh
        run: ./scripts/validate-applications.ps1

      - name: Build the example resume
        shell: pwsh
        run: |
          ./scripts/build-resume.ps1 `
            -DataPath ./resumes/examples/example-resume.json `
            -HtmlPath ./out/example-resume.html
          $generated = (Get-FileHash ./out/example-resume.html -Algorithm SHA256).Hash
          $committed = (Get-FileHash ./resumes/examples/example-resume.html -Algorithm SHA256).Hash
          if ($generated -ne $committed) {
            throw "The committed example resume HTML is stale. Rebuild it before committing."
          }
