<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      --forest: #1f4e45;
      --teal: #2a7068;
      --ink: #1f2427;
      --muted: #505b60;
      --rule: #afc7c1;
      --paper: #ffffff;
      --canvas: #edf1f0;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9.45pt;
      line-height: 1.16;
    }

    .page {
      background: var(--paper);
      box-shadow: 0 10px 30px rgb(31 78 69 / 12%);
      margin: 10mm auto;
      min-height: 279.4mm;
      padding: 14.7mm 19.05mm 13.9mm;
      position: relative;
      width: 215.9mm;
    }

    header { margin-bottom: 2.6mm; }

    h1 {
      color: var(--forest);
      font-size: 24.5pt;
      font-weight: 700;
      letter-spacing: 0.45px;
      line-height: 1;
      margin: 0 0 1.1mm;
      text-transform: uppercase;
    }

    .headline {
      color: var(--teal);
      font-size: 10.55pt;
      font-weight: 700;
      line-height: 1.08;
      margin-bottom: 1.25mm;
      text-transform: uppercase;
    }

    .contact {
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      font-size: 8.65pt;
      gap: 0.5mm 1.7mm;
      line-height: 1.12;
    }

    .contact span:not(:last-child)::after {
      color: var(--muted);
      content: "|";
      margin-left: 1.7mm;
    }

    a { color: inherit; text-decoration: none; }

    main { display: block; }

    section {
      break-inside: avoid;
      margin-top: 2.2mm;
    }

    section:first-child { margin-top: 0; }

    h2 {
      border-bottom: 0.7px solid var(--rule);
      color: var(--teal);
      font-size: 10.55pt;
      font-weight: 700;
      letter-spacing: 0.35px;
      line-height: 1;
      margin: 0 0 1.35mm;
      padding-bottom: 0.65mm;
      text-transform: uppercase;
    }

    p { margin: 0; }

    .profile { font-size: 9.55pt; line-height: 1.2; }

    .skills { display: grid; gap: 0.7mm; }

    .skill-row { display: block; }

    .skill-label {
      color: var(--forest);
      font-weight: 700;
      margin-right: 0.8mm;
    }

    .skill-label::after { content: ":"; }

    .entry {
      break-inside: avoid;
      margin-bottom: 1.75mm;
    }

    .entry:last-child { margin-bottom: 0; }

    .entry-heading {
      align-items: baseline;
      display: flex;
      gap: 4mm;
      justify-content: space-between;
    }

    .entry-title {
      color: var(--forest);
      font-size: 10.05pt;
      font-weight: 700;
    }

    .entry-subtitle {
      color: var(--teal);
      font-size: 10.05pt;
      font-weight: 700;
    }

    .entry-meta {
      color: var(--muted);
      font-size: 8.6pt;
      font-weight: 700;
      white-space: nowrap;
    }

    .entry-subline {
      color: var(--muted);
      font-size: 8.55pt;
      font-style: italic;
      margin-top: 0.25mm;
    }

    ul {
      margin: 0.7mm 0 0;
      padding-left: 5.2mm;
    }

    li {
      line-height: 1.17;
      margin: 0 0 0.6mm;
      padding-left: 0.75mm;
    }

    li::marker { color: var(--teal); }

    .project-description {
      font-size: 9.25pt;
      line-height: 1.17;
      margin-top: 0.55mm;
    }

    .additional-lines {
      display: grid;
      gap: 0.45mm;
      margin-top: 0.7mm;
    }

    .additional-line { line-height: 1.15; }

    .additional-label {
      color: var(--forest);
      font-weight: 700;
      margin-right: 0.8mm;
    }

    footer {
      bottom: 5.6mm;
      color: var(--muted);
      font-size: 7.7pt;
      position: absolute;
      right: 19.05mm;
      text-align: right;
    }

    @page { size: Letter; margin: 0; }

    @media print {
      body { background: var(--paper); }
      .page { box-shadow: none; margin: 0; }
      a { color: inherit; }
    }

    @media screen and (max-width: 820px) {
      .page { margin: 0; min-height: auto; padding: 24px; width: 100%; }
      .entry-heading { align-items: flex-start; flex-direction: column; gap: 0.5mm; }
      .entry-meta { white-space: normal; }
      footer { margin-top: 8mm; position: static; text-align: left; }
    }
  </style>
</head>
<body>
  <article class="page">
    <header>
      <h1>{{NAME}}</h1>
      <div class="headline">{{HEADLINE}}</div>
      <div class="contact">{{CONTACT}}</div>
    </header>
    <main>
      <section>
        <h2>Professional Profile</h2>
        <p class="profile">{{SUMMARY}}</p>
      </section>
      <section>
        <h2>Core Capabilities</h2>
        <div class="skills">{{SKILLS}}</div>
      </section>
      <section>
        <h2>Professional Experience</h2>
        {{EXPERIENCE}}
      </section>
      <section>
        <h2>Selected Product Work</h2>
        {{PROJECTS}}
      </section>
      <section>
        <h2>Education &amp; Credentials</h2>
        {{EDUCATION}}
        <div class="additional-lines">
          {{CERTIFICATIONS}}
          {{LANGUAGES}}
        </div>
      </section>
    </main>
    <footer>{{NOTE}}</footer>
  </article>
</body>
</html>
